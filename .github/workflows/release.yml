name: Build Linux packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать релиз v<VERSION> (только из main)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils desktop-file-utils fakeroot gstreamer1.0-tools \
            gtk-update-icon-cache libgdk-pixbuf2.0-dev patchelf python3-pip \
            python3-setuptools squashfs-tools strace util-linux zsync
          python3 -m pip install --user appimage-builder==1.1.0 packaging==21.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build .deb and AppImage
        run: packaging/build-release.sh

      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" || {
            echo "Release tag must match VERSION ($(cat VERSION))." >&2
            exit 1
          }

      - name: Validate Debian package metadata
        run: |
          for deb in sentinel_*.deb; do dpkg-deb --info "$deb"; done
          sed 's|@APP_PATH@|/usr/lib/sentinel/app.py|g' io.sentinel.VideoClient.desktop.in > /tmp/io.sentinel.VideoClient.desktop
          desktop-file-validate /tmp/io.sentinel.VideoClient.desktop
          mkdir -p /tmp/sentinel-appimage
          sed 's|^Exec=.*|Exec=usr/bin/python3 opt/sentinel/app.py|' io.sentinel.VideoClient.desktop.in \
            | sed 's|@APP_PATH@|opt/sentinel/app.py|g' > /tmp/sentinel-appimage/io.sentinel.VideoClient.desktop
          desktop-file-validate /tmp/sentinel-appimage/io.sentinel.VideoClient.desktop

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            sentinel_*.deb
            Sentinel-*-x86_64.AppImage

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (inputs.publish && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # тег из push тега или v<VERSION> при ручном запуске (тег создаётся на этом коммите)
          tag="$GITHUB_REF_NAME"
          case "$GITHUB_REF" in refs/tags/*) ;; *) tag="v$(cat VERSION)" ;; esac
          gh release create "$tag" sentinel_*.deb Sentinel-*-x86_64.AppImage --generate-notes --target "$GITHUB_SHA"

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder and GNOME 47 SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Cache flatpak-builder downloads
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/io.sentinel.VideoClient.yml') }}

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=repo build-dir \
            packaging/flatpak/io.sentinel.VideoClient.yml
          flatpak build-bundle repo Sentinel.flatpak io.sentinel.VideoClient \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: Sentinel.flatpak
          path: Sentinel.flatpak

  publish-flatpak:
    needs: [build, flatpak]
    if: startsWith(github.ref, 'refs/tags/') || (inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          pattern: Sentinel.flatpak*
          merge-multiple: true

      - name: Attach Flatpak to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          case "$GITHUB_REF" in refs/tags/*) ;; *) tag="v$(cat VERSION)" ;; esac
          mv Sentinel.flatpak "Sentinel-PRO-$(cat VERSION)-x86_64.flatpak"
          gh release upload "$tag" "Sentinel-PRO-$(cat VERSION)-x86_64.flatpak" --clobber
