name: Build Linux packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils desktop-file-utils fakeroot gstreamer1.0-tools \
            gtk-update-icon-cache libgdk-pixbuf2.0-dev patchelf python3-pip \
            python3-setuptools squashfs-tools strace util-linux zsync
          python3 -m pip install --user appimage-builder==1.1.0 packaging==21.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build .deb and AppImage
        run: packaging/build-release.sh

      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" || {
            echo "Release tag must match VERSION ($(cat VERSION))." >&2
            exit 1
          }

      - name: Validate Debian package metadata
        run: |
          dpkg-deb --info sentinel_*.deb
          sed 's|@APP_PATH@|/usr/lib/sentinel/app.py|g' io.sentinel.VideoClient.desktop.in > /tmp/io.sentinel.VideoClient.desktop
          desktop-file-validate /tmp/io.sentinel.VideoClient.desktop
          mkdir -p /tmp/sentinel-appimage
          sed 's|^Exec=.*|Exec=usr/bin/python3 opt/sentinel/app.py|' io.sentinel.VideoClient.desktop.in \
            | sed 's|@APP_PATH@|opt/sentinel/app.py|g' > /tmp/sentinel-appimage/io.sentinel.VideoClient.desktop
          desktop-file-validate /tmp/sentinel-appimage/io.sentinel.VideoClient.desktop

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            sentinel_*.deb
            Sentinel-*-x86_64.AppImage

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sentinel_*.deb Sentinel-*-x86_64.AppImage --generate-notes

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: Sentinel.flatpak
          manifest-path: packaging/flatpak/io.sentinel.VideoClient.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/io.sentinel.VideoClient.yml') }}

  publish-flatpak:
    needs: [build, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          pattern: Sentinel.flatpak*
          merge-multiple: true

      - name: Attach Flatpak to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv Sentinel.flatpak "Sentinel-$(cat VERSION)-x86_64.flatpak"
          gh release upload "$GITHUB_REF_NAME" "Sentinel-$(cat VERSION)-x86_64.flatpak" --clobber
